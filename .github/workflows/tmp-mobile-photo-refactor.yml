name: Temporary mobile photo refactor

on:
  push:
    branches:
      - feature/mobile-3x2-venue-photos

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: f8a5ebb6066bc6da0f02877cfc31b52d75a3914a
          path: before
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-3x2-venue-photos
          path: after
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focus review capture on mobile photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('after/scripts/capture-responsive-review.mjs')
          text = p.read_text()
          old = """        if (mobile && reviewMode === 'bears-say') {\n          await waitFor(() => Boolean(document.querySelector('.detail-fan-experiences')));\n          document.querySelector('.detail-fan-experiences')?.scrollIntoView({ block: 'start', inline: 'nearest' });\n          await sleep(220);\n        }\n        document.body.dataset.reviewReady = 'true';"""
          new = """        if (mobile && reviewMode === 'bears-say') {\n          await waitFor(() => Boolean(document.querySelector('.detail-fan-experiences')));\n          document.querySelector('.detail-fan-experiences')?.scrollIntoView({ block: 'start', inline: 'nearest' });\n          await sleep(220);\n        }\n        if (mobile && reviewMode === 'photo') {\n          await waitFor(() => Boolean(document.querySelector('.detail-photo--mobile-deferred')));\n          const tray = document.querySelector('#tray-selected');\n          const photo = document.querySelector('.detail-photo--mobile-deferred');\n          if (tray && photo) {\n            tray.scrollTop = Math.max(0, photo.offsetTop - 90);\n            await sleep(450);\n            tray.scrollTop = Math.max(0, photo.offsetTop - 90);\n          }\n          await sleep(250);\n        }\n        document.body.dataset.reviewReady = 'true';"""
          if old not in text:
              raise SystemExit('mobile review driver marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Capture comparison screenshots
        env:
          CGB_REVIEW_PROFILE: photo-forward
        run: node after/scripts/capture-responsive-review.mjs before after responsive-review
      - name: Upload focused review
        uses: actions/upload-artifact@v4
        with:
          name: mobile-3x2-focused-review-v2
          path: responsive-review/*mobile-390-photo.png
          if-no-files-found: error
          retention-days: 14
