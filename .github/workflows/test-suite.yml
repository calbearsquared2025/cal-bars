name: Test suite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run check:syntax
      - name: Compact test suite
        timeout-minutes: 5
        run: |
          set -o pipefail
          time npm test 2>&1 | tee test-output.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Public data validation
        run: npm run validate:data
      - name: Private value scan
        run: npm run validate:private
