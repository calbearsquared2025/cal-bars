name: Apply attendance stack fix

on:
  push:
    branches:
      - fix/bears-say-profile-styles

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bears-say-profile-styles
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply narrow Venue Profile attendance fix
        run: |
          python - <<'PY'
          from pathlib import Path

          fan_path = Path('js/fan-intent.js')
          fan = fan_path.read_text()
          old = '''function syncDetailPresence(venueId, isSelected) {
            if (appState.selectedVenueId !== venueId) return;
            const detail = document.querySelector('#venue-detail');
            if (!detail || detail.dataset.venueId !== venueId) return;
            const card = detail.querySelector(':scope > .activity-card');
            if (!card) return;
            let presence = card.querySelector(':scope > .activity-card__presence');
            if (!isSelected) {
              presence?.remove();
              return;
            }
            if (!presence) {
              presence = document.createElement('p');
              presence.className = 'activity-card__presence';
              const current = card.querySelector(':scope > strong');
              if (current) current.insertAdjacentElement('afterend', presence);
              else card.prepend(presence);
            }
            const count = getFanCount(appState.snapshot, appState.gameId, venueId);
            presence.textContent = detailPresenceCopy(count);
          }'''
          new = '''function syncDetailPresence(venueId, isSelected) {
            if (appState.selectedVenueId !== venueId) return;
            const detail = document.querySelector('#venue-detail');
            if (!detail || detail.dataset.venueId !== venueId) return;
            const card = detail.querySelector(':scope > .activity-card');
            if (!card) return;
            let presence = card.querySelector(':scope > .activity-card__presence');
            const count = getFanCount(appState.snapshot, appState.gameId, venueId);
            if (!isSelected && count <= 0) {
              presence?.remove();
              return;
            }
            if (!presence) {
              presence = document.createElement('p');
              presence.className = 'activity-card__presence';
              const current = card.querySelector(':scope > strong');
              if (current) current.insertAdjacentElement('afterend', presence);
              else card.prepend(presence);
            }
            presence.textContent = isSelected
              ? detailPresenceCopy(count)
              : 'Click "I\\'ll be here" below to join them.';
          }'''
          if old not in fan:
              raise SystemExit('fan-intent target block not found')
          fan_path.write_text(fan.replace(old, new, 1))

          css_path = Path('css/venue-profile.css')
          css = css_path.read_text()
          old_css = '''.venue-detail .activity-card:has(.bear-count__number) > p {
            grid-column: 2;
            margin: 0 !important;
            font-size: .75rem !important;
            line-height: 1.35 !important;
          }
'''
          new_css = old_css + '''
          .venue-detail .activity-card:has(.bear-count__number) > .activity-card__presence {
            grid-row: 2;
          }
'''
          if old_css not in css:
              raise SystemExit('venue-profile CSS target block not found')
          css_path.write_text(css.replace(old_css, new_css, 1))

          test_path = Path('tests/fan-intent-profile-presence.test.mjs')
          test_path.write_text('''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          const [source, css] = await Promise.all([
            readFile(new URL('../js/fan-intent.js', import.meta.url), 'utf8'),
            readFile(new URL('../css/venue-profile.css', import.meta.url), 'utf8')
          ]);

          test('Fan Intent presence follows the canonical Venue Profile instead of detailMode', () => {
            const syncPresence = source.match(/function syncDetailPresence\\(venueId, isSelected\\) \\{[\\s\\S]*?\\n\\}/)?.[0] || '';

            assert.doesNotMatch(syncPresence, /appState\\.detailMode/);
            assert.match(syncPresence, /appState\\.selectedVenueId !== venueId/);
            assert.match(syncPresence, /document\\.querySelector\\('#venue-detail'\\)/);
            assert.match(syncPresence, /detail\\.dataset\\.venueId !== venueId/);
            assert.match(syncPresence, /detail\\.querySelector\\(':scope > \\.activity-card'\\)/);
            assert.match(syncPresence, /!isSelected && count <= 0/);
            assert.match(syncPresence, /detailPresenceCopy\\(count\\)/);
            assert.match(syncPresence, /Click "I\\\\'ll be here" below to join them\\./);
          });

          test('Venue Profile attendance stacks its supporting presence copy below the label', () => {
            assert.match(css, /\\.activity-card:has\\(\\.bear-count__number\\) > \\.activity-card__presence \\{[\\s\\S]*grid-row: 2;/);
          });
          ''')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-attendance-stack-fix.yml
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/fan-intent.js css/venue-profile.css tests/fan-intent-profile-presence.test.mjs .github/workflows/apply-attendance-stack-fix.yml
          git commit -m "Stack Venue Profile attendance copy"
          git push origin HEAD:fix/bears-say-profile-styles
