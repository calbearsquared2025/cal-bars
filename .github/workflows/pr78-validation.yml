name: PR 78 validation

on:
  push:
    branches:
      - agent/external-venue-maptiler-cleanup

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused external venue tests
        run: node --test tests/external-venue-core.test.mjs tests/external-venue-script.test.mjs tests/external-venue-interface.test.mjs
      - run: npm test
      - run: npm run validate:data
      - run: npm run test:browser
      - name: Diff check
        run: git diff --check c7415b58a88656bbf732ea1968eb19d4b7086b79...HEAD
