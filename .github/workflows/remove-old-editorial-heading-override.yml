name: Remove obsolete editorial heading override

on:
  push:
    branches:
      - fix/bears-say-profile-styles

permissions:
  contents: write

jobs:
  update-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Remove obsolete desktop CGB SAYS heading override
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('css/venue-detail.css')
          text = path.read_text()
          old = '''  #tray-selected > #venue-detail .detail-editorial h2 {
            margin: 0 0 5px !important;
            font-size: .68rem !important;
          }

          '''
          if old not in text:
              raise SystemExit('Expected obsolete editorial heading override was not found')
          path.write_text(text.replace(old, '', 1))
          PY

      - run: npm test

      - name: Commit focused cleanup and remove temporary workflow
        run: |
          rm .github/workflows/remove-old-editorial-heading-override.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/venue-detail.css .github/workflows/remove-old-editorial-heading-override.yml
          git diff --cached --check
          git commit -m "Fix desktop CGB SAYS heading size"
          git push
