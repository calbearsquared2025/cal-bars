name: Run Milestone 8D cleanup

on:
  push:
    branches:
      - agent/m8a-visual-foundation

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed cleanup payload
        shell: bash
        run: |
          set -euo pipefail
          grep '^H4s' .github/workflows/m8d-publish.yml > /tmp/m8d-payload.b64
          base64 -d /tmp/m8d-payload.b64 | tar -xzf - -C .
          rm -f \
            assets/bear_paw.svg \
            assets/bear_paw_logo.svg \
            assets/cgbfavicon.png \
            assets/favicon.svg \
            assets/social-preview.png \
            assets/social-preview.png.png \
            css/external-watch-party-cta.css \
            css/external-watch-party-plan.css \
            .github/workflows/m8d-validation.yml \
            .github/workflows/m8d-validation-retry.yml \
            .github/workflows/m8d-validation-final.yml \
            .github/workflows/m8d-publish.yml \
            .github/workflows/m8d-runner.yml
      - name: Review final refactor diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff --numstat
          git diff -- js css assets tests
      - name: Run complete validation suite
        run: |
          npm test
          npm run validate:data
          npm run test:browser
          npm run test:migration
      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Milestone 8D launch cleanup"
          git push
