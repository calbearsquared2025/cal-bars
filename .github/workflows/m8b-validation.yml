name: Milestone 8B validation

on:
  push:
    branches:
      - agent/m8a-visual-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run repository tests
        run: npm test
      - name: Validate fallback data
        run: npm run validate:data
      - name: Run browser harness
        run: npm run test:browser
      - name: Run migration tests
        run: npm run test:migration
      - name: Capture mobile acceptance screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/cgb-http.log 2>&1 &
          SERVER_PID=$!
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir=/tmp/cgb-chrome --window-size=390,844 \
            http://127.0.0.1:4173/ >/tmp/cgb-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 -m pip install --quiet websocket-client
          set +e
          python3 scripts/m8b-validation.py >validation-artifacts/m8b-acceptance.log 2>&1
          ACCEPTANCE_STATUS=$?
          set -e
          cat validation-artifacts/m8b-acceptance.log
          exit "$ACCEPTANCE_STATUS"
      - name: Commit validation screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation-artifacts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture Milestone 8B validation artifacts"
          git push
