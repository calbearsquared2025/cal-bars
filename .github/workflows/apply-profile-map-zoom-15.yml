name: Apply profile map zoom 15

on:
  push:
    branches:
      - fix/bears-say-profile-styles
    paths:
      - .github/workflows/apply-profile-map-zoom-15.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bears-say-profile-styles
      - name: Apply focused zoom update
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'js/app.js': [
                  ("  map.dataset.zoom = isMobileLayout() ? '15.4' : '16';", "  map.dataset.zoom = '15';"),
              ],
              'js/icon-upgrade.mjs': [
                  ("const DETAIL_MAP_ZOOM = 16.0;", "const DETAIL_MAP_ZOOM = 15;"),
              ],
              'tests/venue-photo-feature.test.mjs': [
                  ("test('mobile no-photo Profile map is slightly wider while desktop framing stays unchanged', async () => {", "test('mobile and desktop no-photo Profile maps use the same wider zoom', async () => {"),
                  ("assert.match(app, /map\\.dataset\\.zoom = isMobileLayout\\(\\) \\? '15\\.4' : '16'/);", "assert.match(app, /map\\.dataset\\.zoom = '15'/);"),
              ],
              'tests/browser/smoke-runtime-harness.mjs': [
                  ("if (localMap) check(localMap.dataset.zoom === '15.4', 'Mobile full Profile map preview should use the slightly wider zoom');", "if (localMap) check(localMap.dataset.zoom === '15', 'Mobile full Profile map preview should use zoom 15');"),
              ],
          }

          for path_string, pairs in replacements.items():
              path = Path(path_string)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected source in {path_string}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          if "15.4" in Path('js/app.js').read_text():
              raise SystemExit('stale 15.4 remains in js/app.js')
      - name: Commit focused update and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-profile-map-zoom-15.yml
          git add js/app.js js/icon-upgrade.mjs tests/venue-photo-feature.test.mjs tests/browser/smoke-runtime-harness.mjs
          git commit -m "Use zoom 15 for Venue Profile maps"
          git push origin HEAD:fix/bears-say-profile-styles
