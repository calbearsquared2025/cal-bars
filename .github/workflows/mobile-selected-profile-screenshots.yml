name: Mobile selected-profile screenshots

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve screenshot harness
        run: cp scripts/capture-mobile-selected-profile.mjs /tmp/capture-mobile-selected-profile.mjs

      - name: Capture before at 390px
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          node /tmp/capture-mobile-selected-profile.mjs "$GITHUB_WORKSPACE/artifacts/before"

      - name: Capture after at 390px
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          node /tmp/capture-mobile-selected-profile.mjs "$GITHUB_WORKSPACE/artifacts/after"

      - name: Upload comparison screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-selected-profile-390px
          path: artifacts
          if-no-files-found: error
