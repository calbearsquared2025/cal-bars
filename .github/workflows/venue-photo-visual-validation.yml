name: Venue photo visual validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start local preview
        run: |
          python3 -m http.server 8765 > /tmp/cgb-preview.log 2>&1 &
          echo $! > /tmp/cgb-preview.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/cgb-preview.log
          exit 1
      - name: Capture and assert Venue Profile screenshots
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check websocket-client
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --remote-allow-origins='*' about:blank > /tmp/cgb-chrome.log 2>&1 &
          python3 scripts/venue-photo-visual-capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: venue-photo-visuals
          path: docs/validation/venue-photo-visuals/*.png
          if-no-files-found: error
