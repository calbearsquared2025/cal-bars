name: Venue photo visual validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start local preview
        run: |
          python3 -m http.server 8765 > /tmp/cgb-preview.log 2>&1 &
          echo $! > /tmp/cgb-preview.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/cgb-preview.log
          exit 1
      - name: Capture Venue Profile screenshots
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p docs/validation/venue-photo-visuals
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=12000 --screenshot=docs/validation/venue-photo-visuals/busbys-west-iphone-portrait.png 'http://127.0.0.1:8765/?venue=busby-s-west-santa-monica'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=12000 --screenshot=docs/validation/venue-photo-visuals/busbys-west-desktop.png 'http://127.0.0.1:8765/?venue=busby-s-west-santa-monica'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=12000 --screenshot=docs/validation/venue-photo-visuals/no-photo-fallback-iphone.png 'http://127.0.0.1:8765/?venue=george-and-walt-s-oakland'
          test -s docs/validation/venue-photo-visuals/busbys-west-iphone-portrait.png
          test -s docs/validation/venue-photo-visuals/busbys-west-desktop.png
          test -s docs/validation/venue-photo-visuals/no-photo-fallback-iphone.png
      - uses: actions/upload-artifact@v4
        with:
          name: venue-photo-visuals
          path: docs/validation/venue-photo-visuals/*.png
          if-no-files-found: error
