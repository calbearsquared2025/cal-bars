# One-time validation of the cleaned self-contained test state.
name: Temporary minimal test validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete self-contained test suite
        run: npm test
