name: Temporary Issue 121 reconciliation validation

on:
  push:
    branches:
      - fix/121-test-reconciliation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source and unit tests
        run: npm test
      - name: Run browser regression harnesses
        run: npm run test:browser
