name: Temporary Issue 121 reconciliation validation

on:
  push:
    branches:
      - fix/121-test-reconciliation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source and unit tests
        run: npm test
      - name: Run browser regression harnesses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'tests/browser/production-runtime-harness.mjs',
              'tests/browser/venue-detail-runtime-harness.mjs',
          ):
              path = Path(name)
              text = path.read_text()
              old = "  failures.push(`Timed out waiting for ${label}`);\n  return false;"
              replacement = "  throw new Error(`Timed out waiting for ${label}`);"
              if old not in text:
                  raise SystemExit(f'Expected waitFor timeout block not found in {name}')
              path.write_text(text.replace(old, replacement, 1))
          PY
          set +e
          npm run test:browser > /tmp/browser.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 500 /tmp/browser.log
          else
            cat /tmp/browser.log
          fi
          exit $status