name: Temporary minimal test validation

on:
  push:
    branches:
      - fix/121-test-reconciliation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete self-contained test suite
        run: npm test
