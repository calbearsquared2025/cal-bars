name: Temporary Issue 121 reconciliation validation

on:
  push:
    branches:
      - fix/121-test-reconciliation

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validation and record result
        shell: bash
        run: |
          set +e
          npm test > /tmp/unit.log 2>&1
          unit_exit=$?
          npm run test:browser > /tmp/browser.log 2>&1
          browser_exit=$?
          {
            echo "unit_exit=$unit_exit"
            echo "browser_exit=$browser_exit"
            echo "--- unit tail ---"
            tail -n 120 /tmp/unit.log
            echo "--- browser tail ---"
            tail -n 160 /tmp/browser.log
          } > .j-test-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .j-test-result.txt
          git commit -m "Record temporary J validation result"
          git push
          exit 0
