name: Apply Fan Experience docs

on:
  push:
    branches:
      - feature/fan-experiences

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fan-experiences
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-fan-experience-docs.mjs
      - name: Commit documentation updates
        run: |
          if git diff --quiet -- docs/contribution-forms.md docs/public-data-contract.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contribution-forms.md docs/public-data-contract.md
          git commit -m "Document Fan Experiences public and form contracts"
          git push origin HEAD:feature/fan-experiences
