name: Milestone 3 validation

on:
  push:
    branches:
      - feature/fan-intent
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run complete test suite
        run: npm test

      - name: Validate fallback data
        run: npm run validate:data

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/core.mjs
          node --check js/fan-intent.js
          node --check js/fan-intent-core.mjs
          cp apps-script/Code.gs /tmp/Code.js
          cp apps-script/FanIntent.gs /tmp/FanIntent.js
          node --check /tmp/Code.js
          node --check /tmp/FanIntent.js

      - name: Scan committed files for private values
        run: |
          ! grep -RIE "script\.google\.com/macros/s/[A-Za-z0-9_-]+|docs\.google\.com/spreadsheets/d/[A-Za-z0-9_-]+" \
            --exclude-dir=.git --exclude='*.md' .
          ! grep -RIE "browser_[A-Za-z0-9_-]{16,}" \
            --exclude-dir=.git --exclude='*.md' .
