name: Fan Experiences verification

on:
  push:
    branches:
      - feature/fan-experiences
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Full repository verification for this feature branch.
      - run: npm test
      - run: npm run test:browser
      - run: npm run validate:data
