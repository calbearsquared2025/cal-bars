name: Milestone 8D launch cleanup final

on:
  push:
    branches:
      - agent/m8a-visual-foundation

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply behavior-neutral cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def sub(path, pattern, replacement, expected=1, flags=re.S):
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=expected, flags=flags)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {pattern[:100]}')
              file.write_text(updated)

          def insert_before(path, anchor, content):
              file = Path(path)
              text = file.read_text()
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: anchor count changed for {anchor}')
              file.write_text(text.replace(anchor, textwrap.dedent(content) + anchor, 1))

          mobile = Path('js/map-mobile-refinement.mjs')
          text = mobile.read_text()
          if text.count('selectedTrayExpanded = true;') != 4:
              raise SystemExit('map-mobile-refinement: expanded-state assignment count changed')
          mobile.write_text(text.replace('selectedTrayExpanded = true;', 'selectedTrayExpanded = false;'))
          sub(mobile, r"\n\s*document\.addEventListener\('click', openPreviewVenue, \{ capture: true \}\);\s*document\.addEventListener\('click', handleTrayTopTap, \{ capture: true \}\);\s*document\.addEventListener\('click', \(event\) => \{.*?focusVenue\(marker\.dataset\.venueId, \{ force: true \}\)\);\s*\}\);", "\n  document.addEventListener('click', handleDocumentClick, { capture: true });")
          insert_before('js/map-mobile-refinement.mjs', 'function sync() {', '''
          function handleDocumentClick(event) {
            if (event.target.closest?.('#browse-locations-button')) {
              openPreviewVenue(event);
              return;
            }
            if (event.target.closest?.('#tray-handle')) {
              handleTrayTopTap(event);
              return;
            }
            const marker = event.target.closest?.('.cgb-marker[data-venue-id]');
            if (!marker) return;
            selectedTrayExpanded = false;
            lastSelectedVenueId = '';
            lastAutoFocusedVenueId = '';
            requestAnimationFrame(() => focusVenue(marker.dataset.venueId, { force: true }));
          }

          ''')

          sub('js/map-profile-final-pass.mjs', r"\nlet collapsedVenueId = '';\n", '\n')
          sub('js/map-profile-final-pass.mjs', r'\n\s*body\[data-command-surface="map"\].*?\.selected-card__details \{.*?\n\s*\}\n', '\n')
          sub('js/map-profile-final-pass.mjs', r'(body\[data-command-surface="map"\].*?\.selected-card__share \.ui-icon),\s*\n\s*body\[data-command-surface="map"\].*?\.selected-card__details \.ui-icon \{', r'\1 {')
          sub('js/map-profile-final-pass.mjs', r'(body\[data-command-surface="map"\].*?\.party-module__event,)\s*\n\s*(body\[data-command-surface="map"\].*?\.party-module__report),\s*\n\s*body\[data-command-surface="map"\].*?\.selected-card__details \{', r'\1\n      \2 {')
          sub('js/map-profile-final-pass.mjs', r"\n\s*if \(details\) \{\s*details\.classList\.add\('selected-card__details'\);.*?details\.replaceChildren\(.*?\);\s*\}", "\n  details?.remove();")
          sub('js/map-profile-final-pass.mjs', r'\nfunction defaultSelectedTrayToCompact\(root = document\) \{.*?\n\}\n', '\n')
          sub('js/map-profile-final-pass.mjs', r'\n\s*defaultSelectedTrayToCompact\(\);', '')

          sub('js/final-functional-stabilization.mjs', r"\n\s*button\.addEventListener\('click', \(\) => \{\s*clearAddContext\(\);.*?#mobile-search-button'\)\?\.click\(\);\s*\}\);", '')
          insert_before('js/final-functional-stabilization.mjs', 'function routeSelectedVenuePlanThroughAdd(event) {', '''
          function routeAddLocationSearch(event) {
            if (!event.target.closest?.('#add-location-button')) return;
            clearAddContext();
            const input = document.querySelector('#location-query');
            if (input) {
              input.value = '';
              input.dispatchEvent(new Event('input', { bubbles: true }));
            }
            document.querySelector('#mobile-search-button')?.click();
          }

          ''')
          insert_before('js/final-functional-stabilization.mjs', 'function connectApp() {', '''
          function isActivationEvent(event) {
            return event.type !== 'keydown' || event.key === 'Enter' || event.key === ' ';
          }

          function handleInteraction(event) {
            if (!isActivationEvent(event)) return;
            setListLockFromEvent(event);
            handleNavigationContext(event);
            if (event.type !== 'click') return;
            restoreContextForAddAction(event);
            routeAddLocationSearch(event);
            routeSelectedVenuePlanThroughAdd(event);
          }

          ''')
          sub('js/final-functional-stabilization.mjs', r"\n\s*document\.addEventListener\('pointerdown', setListLockFromEvent.*?document\.addEventListener\('click', routeSelectedVenuePlanThroughAdd, \{ capture: true \}\);", "\n  document.addEventListener('pointerdown', handleInteraction, { capture: true });\n  document.addEventListener('keydown', handleInteraction, { capture: true });\n  document.addEventListener('click', handleInteraction, { capture: true });")

          sub('js/icon-upgrade.mjs', r"\n\s*if \(label === 'view details' \|\| label === 'details'\) return 'details';", '')
          sub('js/icons.mjs', r"\n\s*details: \[.*?\n\s*\],", '')
          sub('assets/icons.svg', r'\n\s*<symbol id="icon-details".*?</symbol>', '')

          for path in ['assets/bear_paw.svg','assets/bear_paw_logo.svg','assets/cgbfavicon.png','assets/favicon.svg','assets/social-preview.png','assets/social-preview.png.png','css/external-watch-party-cta.css','css/external-watch-party-plan.css']:
              file = Path(path)
              if not file.exists():
                  raise SystemExit(f'expected cleanup target missing: {path}')
              file.unlink()

          sub('tests/map-profile-final-pass.test.mjs', r"assert\.match\(source, /selected-card__details/\);", r"assert.match(source, /details\\?\\.remove\\(\\)/);", flags=0)
          sub('tests/map-profile-final-pass.test.mjs', r"test\('newly selected venues default to compact.*?\n\}\);\n\n(?=test\('selected RSVP)", textwrap.dedent('''
          test('tray density has one owner and the hidden Details action is removed', () => {
            assert.match(source, /details\?\.remove\(\)/);
            assert.doesNotMatch(source, /collapsedVenueId|defaultSelectedTrayToCompact|#tray-handle'\)\?\.click/);
            assert.match(source, /data-selected-density="compact"[\s\S]*party-module[\s\S]*display: grid !important/);
          });

          '''))
          PY
          cat > tests/launch-cleanup.test.mjs <<'EOF_TEST'
          import assert from 'node:assert/strict';
          import { access, readFile } from 'node:fs/promises';
          import test from 'node:test';

          const root = new URL('../', import.meta.url);
          const removedPaths = ['assets/bear_paw.svg','assets/bear_paw_logo.svg','assets/cgbfavicon.png','assets/favicon.svg','assets/social-preview.png','assets/social-preview.png.png','css/external-watch-party-cta.css','css/external-watch-party-plan.css'];
          async function exists(path) { try { await access(new URL(path, root)); return true; } catch { return false; } }

          test('removes unreferenced launch assets and orphan stylesheets', async () => {
            for (const path of removedPaths) assert.equal(await exists(path), false, `${path} should be removed`);
          });

          test('removes obsolete Details icon and duplicate tray ownership', async () => {
            const [icons, sprite, upgrade, mobile, finalPass] = await Promise.all([
              readFile(new URL('js/icons.mjs', root), 'utf8'), readFile(new URL('assets/icons.svg', root), 'utf8'),
              readFile(new URL('js/icon-upgrade.mjs', root), 'utf8'), readFile(new URL('js/map-mobile-refinement.mjs', root), 'utf8'),
              readFile(new URL('js/map-profile-final-pass.mjs', root), 'utf8')
            ]);
            assert.doesNotMatch(icons, /\bdetails:\s*\[/);
            assert.doesNotMatch(sprite, /icon-details/);
            assert.doesNotMatch(upgrade, /return 'details'/);
            assert.match(mobile, /let selectedTrayExpanded = false/);
            assert.equal((mobile.match(/document\.addEventListener\('click'/g) || []).length, 1);
            assert.doesNotMatch(finalPass, /collapsedVenueId|defaultSelectedTrayToCompact|#tray-handle'\)\?\.click/);
          });

          test('stabilization interactions are delegated without changing routes', async () => {
            const source = await readFile(new URL('js/final-functional-stabilization.mjs', root), 'utf8');
            assert.equal((source.match(/document\.addEventListener\('pointerdown'/g) || []).length, 1);
            assert.equal((source.match(/document\.addEventListener\('keydown'/g) || []).length, 1);
            assert.equal((source.match(/document\.addEventListener\('click'/g) || []).length, 1);
            assert.match(source, /routeAddLocationSearch/);
            assert.match(source, /routeSelectedVenuePlanThroughAdd/);
          });
          EOF_TEST
          sed -i 's/^          //' tests/launch-cleanup.test.mjs
      - name: Review refactor diff
        run: |
          git diff --check
          git diff --stat
          git diff -- js css assets tests
      - name: Run complete validation suite
        run: |
          npm test
          npm run validate:data
          npm run test:browser
          npm run test:migration
      - name: Commit validated cleanup
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Milestone 8D launch cleanup"
          git push
