name: Issue 121 temporary baseline snapshot

on:
  push:
    branches:
      - fix/issue-121-hardening

permissions:
  contents: read

jobs:
  baseline-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run baseline suites
        shell: bash
        run: |
          set +e
          npm test > issue-121-unit.log 2>&1
          unit_status=$?
          npm run test:browser > issue-121-browser.log 2>&1
          browser_status=$?
          printf 'unit=%s\nbrowser=%s\n' "$unit_status" "$browser_status" | tee issue-121-baseline-status.txt
          exit 0
      - name: Package checkout
        shell: bash
        run: |
          tar --exclude=.git --exclude=repository.tgz -czf repository.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: issue-121-baseline-snapshot
          path: |
            repository.tgz
            issue-121-unit.log
            issue-121-browser.log
            issue-121-baseline-status.txt
          if-no-files-found: error
