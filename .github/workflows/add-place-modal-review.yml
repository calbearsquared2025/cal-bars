name: Add place modal review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  screenshots:
    if: github.head_ref == 'fix/add-place-modal-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before
      - name: Checkout review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture Add this place before/after screenshots
        run: node after/scripts/capture-add-place-modal-review.mjs before after add-place-modal-review
      - name: Upload Add this place screenshots
        uses: actions/upload-artifact@v4
        with:
          name: add-place-modal-layout-screenshots
          path: add-place-modal-review/*.png
          if-no-files-found: error
          retention-days: 14
