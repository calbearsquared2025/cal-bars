name: Milestone 5B validation

on:
  push:
    branches:
      - feature/external-venue-search
      - feature/m5-watch-party-discovery-foundation
      - feature/m5-minimal-watch-party-automation
      - feature/m5b-watch-party-form-entry-point
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run focused Milestone 5B tests
        run: |
          node --test \
            tests/watch-party-form-entry-point.test.mjs \
            tests/watch-party-form-processing.test.mjs \
            tests/watch-party-form-config.test.mjs \
            tests/watch-party-required-fields.test.mjs \
            tests/watch-party-closed-game.test.mjs

      - name: Run complete test suite
        run: npm test

      - name: Run frontend-to-mocked-backend browser harness
        run: npm run test:browser

      - name: Validate fallback data
        run: npm run validate:data

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/app-state.mjs
          node --check js/core.mjs
          node --check js/fan-intent.js
          node --check js/fan-intent-core.mjs
          node --check js/fan-intent-controller.mjs
          node --check js/external-venue-search.js
          node --check js/external-venue-core.mjs
          node --check js/watch-party-form.js
          node --check js/watch-party-form-core.mjs
          node --check scripts/run-browser-harness.mjs
          node --check scripts/scan-private-values.mjs
          node --check tests/browser/external-venue-harness.mjs

      - name: Check combined Apps Script syntax
        run: |
          cat apps-script/Code.gs \
              apps-script/ColumnFormats.gs \
              apps-script/ExternalVenue.gs \
              apps-script/FanIntent.gs \
              apps-script/TestData.gs \
              apps-script/WatchPartyAutomation.gs \
              apps-script/WatchPartyDiscovery.gs \
              apps-script/WatchPartyFormConfig.gs > /tmp/cgb-apps-script.js
          node --check /tmp/cgb-apps-script.js

      - name: Check diff formatting
        run: git diff --check origin/main...HEAD

      - name: Scan committed source for private values
        run: node scripts/scan-private-values.mjs
