name: CGB continuous integration

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run focused Watch Party tests
        run: |
          node --test \
            tests/watch-party-form-entry-point.test.mjs \
            tests/watch-party-form-processing.test.mjs \
            tests/watch-party-form-config.test.mjs \
            tests/watch-party-required-fields.test.mjs \
            tests/watch-party-closed-game.test.mjs

      - name: Run focused Venue migration and load tests
        run: npm run test:migration

      - name: Run complete test suite
        run: npm test

      - name: Run frontend-to-mocked-backend browser harness
        run: npm run test:browser

      - name: Validate fallback data
        run: npm run validate:data

      - name: Check JavaScript syntax
        run: |
          find js scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | sort -z \
            | xargs -0 -n1 node --check

      - name: Check combined Apps Script syntax
        run: |
          cat apps-script/Code.gs \
              apps-script/ColumnFormats.gs \
              apps-script/ExternalVenue.gs \
              apps-script/FanIntent.gs \
              apps-script/TestData.gs \
              apps-script/WatchPartyAutomation.gs \
              apps-script/WatchPartyDiscovery.gs \
              apps-script/WatchPartyFormConfig.gs > /tmp/cgb-apps-script.js
          node --check /tmp/cgb-apps-script.js

      - name: Check diff formatting
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: git diff --check origin/main...HEAD

      - name: Scan committed source for private values
        run: node scripts/scan-private-values.mjs
