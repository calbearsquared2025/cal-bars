name: Milestone 8D launch cleanup

on:
  push:
    branches:
      - agent/m8a-visual-foundation

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply behavior-neutral cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              file.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=0):
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern}')
              file.write_text(updated)

          mobile = Path('js/map-mobile-refinement.mjs')
          text = mobile.read_text()
          if text.count('selectedTrayExpanded = true;') != 4:
              raise SystemExit('map-mobile-refinement: unexpected expanded-state assignment count')
          text = text.replace('selectedTrayExpanded = true;', 'selectedTrayExpanded = false;')
          listener_block = """  document.addEventListener('click', openPreviewVenue, { capture: true });
          document.addEventListener('click', handleTrayTopTap, { capture: true });

          document.addEventListener('click', (event) => {
            const marker = event.target.closest?.('.cgb-marker[data-venue-id]');
            if (!marker) return;
            selectedTrayExpanded = false;
            lastSelectedVenueId = '';
            lastAutoFocusedVenueId = '';
            requestAnimationFrame(() => focusVenue(marker.dataset.venueId, { force: true }));
          });
          """
          if text.count(listener_block) != 1:
              raise SystemExit('map-mobile-refinement: document listener block changed')
          text = text.replace(listener_block, """  document.addEventListener('click', handleDocumentClick, { capture: true });
          """, 1)
          marker_handler = """function handleDocumentClick(event) {
            if (event.target.closest?.('#browse-locations-button')) {
              openPreviewVenue(event);
              return;
            }
            if (event.target.closest?.('#tray-handle')) {
              handleTrayTopTap(event);
              return;
            }

            const marker = event.target.closest?.('.cgb-marker[data-venue-id]');
            if (!marker) return;
            selectedTrayExpanded = false;
            lastSelectedVenueId = '';
            lastAutoFocusedVenueId = '';
            requestAnimationFrame(() => focusVenue(marker.dataset.venueId, { force: true }));
          }

          """
          anchor = 'function sync() {'
          if text.count(anchor) != 1:
              raise SystemExit('map-mobile-refinement: sync anchor changed')
          mobile.write_text(text.replace(anchor, marker_handler + anchor, 1))

          final_pass = Path('js/map-profile-final-pass.mjs')
          text = final_pass.read_text().replace("let collapsedVenueId = '';\n\n", '', 1)
          for pattern in [
              r'''\n      body\[data-command-surface="map"\] #map-view > #venue-tray\.venue-tray\.tray--selected \.action-row > \.selected-card__details \{.*?\n      \}\n''',
              r'''\nfunction defaultSelectedTrayToCompact\(root = document\) \{.*?\n\}\n'''
          ]:
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'map-profile-final-pass: expected one match for {pattern}')
          for old, new in [
              ("      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected .action-row > .selected-card__share .ui-icon,\n      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected .action-row > .selected-card__details .ui-icon {", "      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected .action-row > .selected-card__share .ui-icon {"),
              ("      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected[data-selected-density=\"compact\"] .party-module__event,\n      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected[data-selected-density=\"compact\"] .party-module__report,\n      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected[data-selected-density=\"compact\"] .selected-card__details {", "      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected[data-selected-density=\"compact\"] .party-module__event,\n      body[data-command-surface=\"map\"] #map-view > #venue-tray.venue-tray.tray--selected[data-selected-density=\"compact\"] .party-module__report {"),
              ("  if (details) {\n    details.classList.add('selected-card__details');\n    const icon = details.querySelector('.ui-icon') || createIcon('details');\n    details.replaceChildren(icon, document.createTextNode('Details'));\n  }", "  details?.remove();"),
              ("  refineActions();\n  defaultSelectedTrayToCompact();", "  refineActions();")
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'map-profile-final-pass: expected one exact match: {old[:80]}')
              text = text.replace(old, new, 1)
          final_pass.write_text(text)

          stabilization = Path('js/final-functional-stabilization.mjs')
          text = stabilization.read_text()
          per_button = """  button.addEventListener('click', () => {
            clearAddContext();
            const input = document.querySelector('#location-query');
            if (input) {
              input.value = '';
              input.dispatchEvent(new Event('input', { bubbles: true }));
            }
            document.querySelector('#mobile-search-button')?.click();
          });
          """
          if text.count(per_button) != 1:
              raise SystemExit('final-functional-stabilization: Add listener changed')
          text = text.replace(per_button, '', 1)
          route = """function routeAddLocationSearch(event) {
            if (!event.target.closest?.('#add-location-button')) return;
            clearAddContext();
            const input = document.querySelector('#location-query');
            if (input) {
              input.value = '';
              input.dispatchEvent(new Event('input', { bubbles: true }));
            }
            document.querySelector('#mobile-search-button')?.click();
          }

          """
          anchor = 'function routeSelectedVenuePlanThroughAdd(event) {'
          if text.count(anchor) != 1:
              raise SystemExit('final-functional-stabilization: route anchor changed')
          text = text.replace(anchor, route + anchor, 1)
          interaction = """function isActivationEvent(event) {
            return event.type !== 'keydown' || event.key === 'Enter' || event.key === ' ';
          }

          function handleInteraction(event) {
            if (!isActivationEvent(event)) return;
            setListLockFromEvent(event);
            handleNavigationContext(event);
            if (event.type !== 'click') return;
            restoreContextForAddAction(event);
            routeAddLocationSearch(event);
            routeSelectedVenuePlanThroughAdd(event);
          }

          """
          anchor = 'function connectApp() {'
          if text.count(anchor) != 1:
              raise SystemExit('final-functional-stabilization: connect anchor changed')
          text = text.replace(anchor, interaction + anchor, 1)
          old_listeners = """  document.addEventListener('pointerdown', setListLockFromEvent, { capture: true });
          document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') setListLockFromEvent(event);
          }, { capture: true });
          document.addEventListener('click', setListLockFromEvent, { capture: true });
          document.addEventListener('pointerdown', handleNavigationContext, { capture: true });
          document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') handleNavigationContext(event);
          }, { capture: true });
          document.addEventListener('click', handleNavigationContext, { capture: true });
          document.addEventListener('click', restoreContextForAddAction, { capture: true });
          document.addEventListener('click', routeSelectedVenuePlanThroughAdd, { capture: true });
          """
          new_listeners = """  document.addEventListener('pointerdown', handleInteraction, { capture: true });
          document.addEventListener('keydown', handleInteraction, { capture: true });
          document.addEventListener('click', handleInteraction, { capture: true });
          """
          if text.count(old_listeners) != 1:
              raise SystemExit('final-functional-stabilization: listener block changed')
          stabilization.write_text(text.replace(old_listeners, new_listeners, 1))

          replace_once('js/icon-upgrade.mjs', "  if (label === 'view details' || label === 'details') return 'details';\n", '')
          regex_once('js/icons.mjs', r"  details: \[\n    \['rect'.*?\n  \],\n", '', re.S)
          regex_once('assets/icons.svg', r'  <symbol id="icon-details".*?</symbol>\n', '', re.S)

          for path in ['assets/bear_paw.svg','assets/bear_paw_logo.svg','assets/cgbfavicon.png','assets/favicon.svg','assets/social-preview.png','assets/social-preview.png.png','css/external-watch-party-cta.css','css/external-watch-party-plan.css']:
              file = Path(path)
              if not file.exists():
                  raise SystemExit(f'expected cleanup target missing: {path}')
              file.unlink()

          profile_test = Path('tests/map-profile-final-pass.test.mjs')
          text = profile_test.read_text()
          for old, new in [
              ("  assert.match(source, /selected-card__details/);", "  assert.match(source, /details\\?\\.remove\\(\\)/);"),
              ("test('newly selected venues default to compact while retaining the summary and RSVP', () => {\n  assert.match(source, /defaultSelectedTrayToCompact/);\n  assert.match(source, /tray\\.dataset\\.selectedDensity === 'expanded'/);\n  assert.match(source, /#tray-handle'\\)\\?\\.click/);\n  assert.match(source, /data-selected-density=\"compact\"[\\s\\S]*party-module[\\s\\S]*display: grid !important/);\n  assert.match(source, /data-selected-density=\"compact\"[\\s\\S]*selected-card__details[\\s\\S]*display: none !important/);\n});", "test('tray density has one owner and the hidden Details action is removed', () => {\n  assert.match(source, /details\\?\\.remove\\(\\)/);\n  assert.doesNotMatch(source, /collapsedVenueId|defaultSelectedTrayToCompact|#tray-handle'\\)\\?\\.click/);\n  assert.match(source, /data-selected-density=\"compact\"[\\s\\S]*party-module[\\s\\S]*display: grid !important/);\n});")
          ]:
              if text.count(old) != 1:
                  raise SystemExit('map-profile-final-pass.test: expected assertion block changed')
              text = text.replace(old, new, 1)
          profile_test.write_text(text)

          Path('tests/launch-cleanup.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import { access, readFile } from 'node:fs/promises';
          import test from 'node:test';

          const root = new URL('../', import.meta.url);
          const removedPaths = ['assets/bear_paw.svg','assets/bear_paw_logo.svg','assets/cgbfavicon.png','assets/favicon.svg','assets/social-preview.png','assets/social-preview.png.png','css/external-watch-party-cta.css','css/external-watch-party-plan.css'];

          async function exists(path) {
            try { await access(new URL(path, root)); return true; } catch { return false; }
          }

          test('removes unreferenced launch assets and orphan stylesheets', async () => {
            for (const path of removedPaths) assert.equal(await exists(path), false, `${path} should be removed`);
          });

          test('removes the obsolete Details icon path', async () => {
            const [icons, sprite, upgrade] = await Promise.all([
              readFile(new URL('js/icons.mjs', root), 'utf8'),
              readFile(new URL('assets/icons.svg', root), 'utf8'),
              readFile(new URL('js/icon-upgrade.mjs', root), 'utf8')
            ]);
            assert.doesNotMatch(icons, /\bdetails:\s*\[/);
            assert.doesNotMatch(sprite, /icon-details/);
            assert.doesNotMatch(upgrade, /label === 'view details'|return 'details'/);
          });

          test('selected tray density is owned by map-mobile refinement only', async () => {
            const [mobile, finalPass] = await Promise.all([
              readFile(new URL('js/map-mobile-refinement.mjs', root), 'utf8'),
              readFile(new URL('js/map-profile-final-pass.mjs', root), 'utf8')
            ]);
            assert.match(mobile, /let selectedTrayExpanded = false/);
            assert.equal((mobile.match(/document\.addEventListener\('click'/g) || []).length, 1);
            assert.doesNotMatch(finalPass, /collapsedVenueId|defaultSelectedTrayToCompact|#tray-handle'\)\?\.click/);
          });

          test('stabilization interactions are delegated without changing routes', async () => {
            const source = await readFile(new URL('js/final-functional-stabilization.mjs', root), 'utf8');
            assert.equal((source.match(/document\.addEventListener\('pointerdown'/g) || []).length, 1);
            assert.equal((source.match(/document\.addEventListener\('keydown'/g) || []).length, 1);
            assert.equal((source.match(/document\.addEventListener\('click'/g) || []).length, 1);
            assert.match(source, /routeAddLocationSearch/);
            assert.match(source, /routeSelectedVenuePlanThroughAdd/);
          });
          '''.replace(/^          /gm, ''))
          PY
      - name: Review refactor diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- js css assets tests
      - name: Run repository tests
        run: npm test
      - name: Validate fallback data
        run: npm run validate:data
      - name: Run browser harness
        run: npm run test:browser
      - name: Run migration tests
        run: npm run test:migration
      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Milestone 8D launch cleanup"
          git push
